name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Smoke test MCP stdio handshake
        run: |
          node -e '
          import { spawn } from "node:child_process";
          import assert from "node:assert";

          const proc = spawn("node", ["server.mjs"], { stdio: ["pipe", "pipe", "inherit"] });

          const timer = setTimeout(() => {
            console.error("Timeout: server did not respond to handshake within 10s");
            proc.kill();
            process.exit(1);
          }, 10000);

          let buffer = "";
          proc.stdout.on("data", (chunk) => {
            buffer += chunk.toString();
            let nl;
            while ((nl = buffer.indexOf("\n")) >= 0) {
              const line = buffer.slice(0, nl).trim();
              buffer = buffer.slice(nl + 1);
              if (!line) continue;
              const msg = JSON.parse(line);
              if (msg.error) {
                console.error("Received JSON-RPC error:", msg.error);
                clearTimeout(timer);
                process.exit(1);
              }
              if (msg.id === 1) {
                assert(msg.result?.serverInfo?.name === "project100", "initialize failed serverInfo check");
                console.log("initialize ok:", msg.result.serverInfo);
                proc.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list" }) + "\n");
              } else if (msg.id === 2) {
                const tools = msg.result?.tools;
                assert(Array.isArray(tools) && tools.length > 0, "tools/list failed or returned 0 tools");
                console.log(`tools/list ok: ${tools.length} tools`);
                clearTimeout(timer);
                proc.kill();
                process.exit(0);
              }
            }
          });

          proc.on("error", (err) => {
            console.error("Failed to start server.mjs:", err);
            clearTimeout(timer);
            process.exit(1);
          });

          proc.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 1, method: "initialize", params: {} }) + "\n");
          '
